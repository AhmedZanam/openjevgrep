[package]
name = "openjevgrep"
version = "0.1.0"
edition = "2021"
description = "Local-first semantic grep powered by OpenJev"
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "ojg_core"
path = "src/lib.rs"

[[bin]]
name = "ojg"
path = "src/bin/ojg.rs"

[[bin]]
name = "ojg-eval"
path = "src/bin/ojg_eval.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
dirs = "6"
globset = "0.4"
ignore = "0.4"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time", "io-std"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-java = "0.20"
tree-sitter-go = "0.20"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"

[features]
live-tests = []

[[bench]]
name = "search"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
