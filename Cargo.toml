[package]
name = "openjevgrep"
version = "0.1.0"
edition = "2021"
description = "Local-first semantic grep powered by OpenJev"
license = "Apache-2.0"
readme = false

[lib]
name = "ojg_core"
path = "src/lib.rs"

[[bin]]
name = "ojg"
path = "src/bin/ojg.rs"

[[bin]]
name = "ojg-eval"
path = "src/bin/ojg_eval.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
globset = "0.4"
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
live-tests = []

[profile.release]
lto = "thin"
codegen-units = 1
